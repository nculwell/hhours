<!DOCTYPE html>
<html>
    <head>
        <title='Weekly schedule hours calculator' />
<style>
.row-title {
    font-weight: bold;
}
#increments td {
    text-align: center;
}
#top {
    font-size: 1.5rem;
}
#schedule {
    margin-top: 1rem;
    font-family: monospace;
    font-size: 1.5rem;
}
input[type='text'] {
    font-size: 1rem;
    width: 10rem;
}
</style>
    </head>
    <body>
        <h1>Weekly schedule hours calculator</h1>
        <div id='top'>
            <div>
                TOTAL HOURS: <span id='total-hours'>0</span>
            </div>
            <div>
                LUNCH BREAK: <input id='lunch-hours' type='text' />
            </div>
        </div>
        <table>
            <thead>
                <th></th>
                <th>Sun</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </thead>
            <tr id='start-times'>
                <td class='row-title'>START</td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
            </tr>
            <tr id='end-times'>
                <td class='row-title'>END</td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
                <td><input type='text' /></td>
            </tr>
            <tr id='increments'>
                <td class='row-title'>SHIFT</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
        <div id='schedule'>
            (SCHEDULE)
        </div>
        <script src='hhours.js'></script>
        <script>hoursInit()</script>
    </body>
</html>
